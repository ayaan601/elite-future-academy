{% extends "base.html" %}
{% block content %}

<div class="banner">
  <div>
    <h1 style="font-size:28px">Welcome to Elite Future Academy 👋</h1>
    <p style="opacity:0.7;margin-top:8px">Pakistan's Most Advanced School Management System</p>
  </div>
  <img src="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?q=80&w=1000" alt="">
</div>

<div class="stats">
  <div class="stat-card"><i class="fas fa-user-graduate" style="background:#e0f2fe;color:#0284c7"></i><div><h4>{{ students_count or 150 }}</h4><p style="font-size:12px;color:gray">Total Students</p></div></div>
  <div class="stat-card"><i class="fas fa-chalkboard-teacher" style="background:#dcfce7;color:#16a34a"></i><div><h4>{{ teachers_count or 12 }}</h4><p style="font-size:12px;color:gray">Total Teachers</p></div></div>
  <div class="stat-card"><i class="fas fa-wallet" style="background:#fef3c7;color:#d97706"></i><div><h4>Rs. 2.5L</h4><p style="font-size:12px;color:gray">Fees Collected</p></div></div>
  <div class="stat-card"><i class="fas fa-calendar-check" style="background:#fce7f3;color:#db2777"></i><div><h4>92%</h4><p style="font-size:12px;color:gray">Attendance</p></div></div>
</div>

{% endblock %}
