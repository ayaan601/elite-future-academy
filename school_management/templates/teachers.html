{% extends "base.html" %}
{% block content %}

<div class="card">
  <h3>Add Teacher</h3>
  <form action="/add_teacher" method="POST">
    <input type="text" name="name" placeholder="Teacher Name" required>
    <input type="text" name="subject" placeholder="Subject" required>
    <input type="text" name="email" placeholder="Subject" required>
    <input type="text" name="contact" placeholder="Contact">
    <button class="btn" type="submit">Add Teacher</button>
  </form>
</div>

<div class="card">
  <h3>Teachers List</h3>
  <table>
    <tr><th>ID</th><th>Name</th><th>Subject</th><th>Contact</th><th>Action</th></tr>
    {% for t in teachers %}
    <tr>
      <td>{{ t[0] }}</td>
      <td>{{ t[1] }}</td>
      <td>{{ t[2] }}</td>
      <td>{{ t[3] }}</td>
      <td><a href="/delete_teacher/{{ t[0] }}" class="delete-btn">Delete</a></td>
    </tr>
    {% endfor %}
  </table>
</div>

{% endblock %}
