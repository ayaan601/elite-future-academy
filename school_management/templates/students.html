{% extends "base.html" %}
{% block content %}

<div class="card">
  <h3>Add Student</h3>
  <form action="/add_student" method="POST">
    <input type="text" name="name" placeholder="Name" required>
    <input type="text" name="class_name" placeholder="Class" required>
    <input type="text" name="roll_no" placeholder="Roll No" required>
    <input type="text" name="parent_name" placeholder="Parent Name">
    <input type="text" name="contact" placeholder="Contact">
    <button class="btn" type="submit">Add</button>
  </form>
</div>

<div class="card">
  <h3>Students List</h3>
  <table>
    <tr><th>ID</th><th>Name</th><th>Class</th><th>Roll</th><th>Action</th></tr>
    {% for s in students %}
    <tr><td>{{ s[0] }}</td><td>{{ s[1] }}</td><td>{{ s[2] }}</td><td>{{ s[3] }}</td><td><a href="/delete_student/{{ s[0] }}" class="delete-btn">Delete</a></td></tr>
    {% endfor %}
  </table>
</div>

{% endblock %}
