<!DOCTYPE html>
<html>
<head>
    <title>Login - Elite Future Academy</title>
    <style>
        body { font-family: Arial; background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin:0; }
        .box { background: white; padding: 40px; border-radius: 15px; width: 320px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        h2 { margin-bottom: 5px; color: #0f172a; }
        span { color: #6366f1; }
        input { width: 90%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
        button { width: 100%; padding: 12px; background: #6366f1; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #4f46e5; }
        .error { color: red; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>ELITE FUTURE<br><span>ACADEMY</span></h2>
        <p>Management Login</p>
        <form method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
               {% if error %}
        <div class="error" style="color:red;">{{ error }}</div>
        {% endif %}
    </div>
</body>
</html>
    </div>
</body>
</html>
